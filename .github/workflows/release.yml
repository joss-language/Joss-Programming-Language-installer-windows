name: Build & Release Windows Installer

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta de versión (ej. v1.0.0). Si se omite, se lee del .csproj'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve release tag
        id: release_meta
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              $tag = '${{ github.ref_name }}'
            } else {
              $ver = (dotnet msbuild Joss-Programming-Language-installer.csproj -getProperty:Version).Trim()
              if ([string]::IsNullOrWhiteSpace($ver)) {
                $ver = '1.0.0'
              }
              if (-not $ver.StartsWith("v") -and -not $ver.StartsWith("V")) {
                $tag = "v$ver"
              } else {
                $tag = $ver
              }
            }
          }
          Write-Host "Etiqueta resuelta para la release: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish x64 Package
        run: |
          dotnet publish Joss-Programming-Language-installer.csproj -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:PublishSingleFile=false -p:PublishTrimmed=false -o dist/x64_app
          Compress-Archive -Path dist/x64_app/* -DestinationPath dist/joss-installer-windows-x64.zip -CompressionLevel Optimal

      - name: Publish ARM64 Package
        run: |
          dotnet publish Joss-Programming-Language-installer.csproj -c Release -p:Platform=arm64 -r win-arm64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:PublishSingleFile=false -p:PublishTrimmed=false -o dist/arm64_app
          Compress-Archive -Path dist/arm64_app/* -DestinationPath dist/joss-installer-windows-arm64.zip -CompressionLevel Optimal

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          $files = @(
            "dist/joss-installer-windows-x64.zip",
            "dist/joss-installer-windows-arm64.zip"
          )

          # Verificar si la release ya existe
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json tagName 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            Write-Host "La release '$env:RELEASE_TAG' ya existe. Subiendo y actualizando archivos..."
            gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudieron actualizar los archivos de la release '$env:RELEASE_TAG'"
            }
            Write-Host "✨ Release '$env:RELEASE_TAG' actualizada correctamente."
          } else {
            Write-Host "Creando nueva release '$env:RELEASE_TAG'..."
            gh release create $env:RELEASE_TAG @files --repo $env:GH_REPO --title "Joss Installer $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Error al crear la release '$env:RELEASE_TAG'"
            }
            Write-Host "✨ Release '$env:RELEASE_TAG' creada exitosamente."
          }
