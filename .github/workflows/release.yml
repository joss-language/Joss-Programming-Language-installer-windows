name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish x64 Single-File Executable
        run: |
          dotnet publish Joss-Programming-Language-installer.csproj -c Release -p:Platform=x64 -r win-x64 -p:WindowsPackageType=None -p:PublishSingleFile=true -o dist/x64
          Copy-Item dist/x64/Joss-Programming-Language-installer.exe dist/joss-installer-windows-x64.exe

      - name: Publish ARM64 Single-File Executable
        run: |
          dotnet publish Joss-Programming-Language-installer.csproj -c Release -p:Platform=arm64 -r win-arm64 -p:WindowsPackageType=None -p:PublishSingleFile=true -o dist/arm64
          Copy-Item dist/arm64/Joss-Programming-Language-installer.exe dist/joss-installer-windows-arm64.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/joss-installer-windows-x64.exe
            dist/joss-installer-windows-arm64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
